name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  image-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce an owner-only checkout
        run: chmod -R go-rwx controller frontend third_party pyproject.toml
      - name: Build and check imports as the runtime user
        run: docker build --tag dillflix-controller:permissions .
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -o faulthandler_timeout=30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
