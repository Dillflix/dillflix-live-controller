[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dillflix-prime-player"
version = "0.1.0a37"
description = "Prime Video Fire TV runtime page browsing, search and playback controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
device = ["frida==17.2.17", "zstandard>=0.23,<1"]

[project.scripts]
prime-player = "dillflix_prime_player.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dillflix_prime_player = ["_runtime/*.js", "_runtime/*.c", "_runtime/*.json", "py.typed"]

