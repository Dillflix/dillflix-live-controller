services:
  controller:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      CONTROLLER_MODE: ${CONTROLLER_MODE:-demo}
      TEAMARR_URL: ${TEAMARR_URL:-}
      TEAMARR_TOKEN: ${TEAMARR_TOKEN:-}
      FEED_INTERVAL_SECONDS: ${FEED_INTERVAL_SECONDS:-60}
      STATUS_INTERVAL_SECONDS: ${STATUS_INTERVAL_SECONDS:-15}
      NAVIGATION_TIMEOUT_SECONDS: ${NAVIGATION_TIMEOUT_SECONDS:-120}
      PLAYBACK_RECOVERY_GRACE_SECONDS: ${PLAYBACK_RECOVERY_GRACE_SECONDS:-60}
      JOB_HISTORY_LIMIT: ${JOB_HISTORY_LIMIT:-1000}
      COMMAND_HISTORY_LIMIT: ${COMMAND_HISTORY_LIMIT:-10000}
      CATALOG_RETENTION_DAYS: ${CATALOG_RETENTION_DAYS:-30}
      CONTROLLER_DATABASE: /data/${CONTROLLER_MODE:-demo}.sqlite3
    volumes:
      - controller-data:/data
volumes:
  controller-data:
