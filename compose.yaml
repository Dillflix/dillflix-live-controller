services:
  controller:
    build: .
    restart: unless-stopped
    ports:
      - "${CONTROLLER_BIND_ADDRESS:-0.0.0.0}:${CONTROLLER_PORT:-8790}:8790"
    environment:
      CONTROLLER_MODE: ${CONTROLLER_MODE:-demo}
      TEAMARR_URL: ${TEAMARR_URL:-}
      TEAMARR_TOKEN: ${TEAMARR_TOKEN:-}
      FEED_INTERVAL_SECONDS: ${FEED_INTERVAL_SECONDS:-60}
      STATUS_INTERVAL_SECONDS: ${STATUS_INTERVAL_SECONDS:-15}
      NAVIGATION_TIMEOUT_SECONDS: ${NAVIGATION_TIMEOUT_SECONDS:-120}
      PLAYBACK_RECOVERY_GRACE_SECONDS: ${PLAYBACK_RECOVERY_GRACE_SECONDS:-60}
      JOB_HISTORY_LIMIT: ${JOB_HISTORY_LIMIT:-1000}
      COMMAND_HISTORY_LIMIT: ${COMMAND_HISTORY_LIMIT:-10000}
      CATALOG_RETENTION_DAYS: ${CATALOG_RETENTION_DAYS:-30}
      SCREEN_ADB_SERIAL: ${SCREEN_ADB_SERIAL:-}
      SCREEN_MAX_SIZE: ${SCREEN_MAX_SIZE:-1280}
      SCREEN_MAX_FPS: ${SCREEN_MAX_FPS:-30}
      SCREEN_BIT_RATE: ${SCREEN_BIT_RATE:-2000000}
      PLAYBACK_ADAPTER: ${PLAYBACK_ADAPTER:-simulator}
      PRIME_PLAYER_SOCKET: ${PRIME_PLAYER_SOCKET:-}
      PRIME_PLAYER_MATCH_MODEL: ${PRIME_PLAYER_MATCH_MODEL:-}
      PRIME_PLAYER_SEARCH_TIMEOUT_SECONDS: ${PRIME_PLAYER_SEARCH_TIMEOUT_SECONDS:-100}
      PRIME_PLAYER_STATUS_TIMEOUT_SECONDS: ${PRIME_PLAYER_STATUS_TIMEOUT_SECONDS:-10}
      EXECUTOR_API_TOKEN: ${EXECUTOR_API_TOKEN:-}
      EXECUTOR_LLM_BASE_URL: ${EXECUTOR_LLM_BASE_URL:-}
      EXECUTOR_LLM_API_KEY: ${EXECUTOR_LLM_API_KEY:-}
      EXECUTOR_ACTOR_MODEL: ${EXECUTOR_ACTOR_MODEL:-}
      EXECUTOR_OBSERVER_MODEL: ${EXECUTOR_OBSERVER_MODEL:-}
      EXECUTOR_ACTOR_PROTOCOL: ${EXECUTOR_ACTOR_PROTOCOL:-json}
      EXECUTOR_STRUCTURED_OUTPUT: ${EXECUTOR_STRUCTURED_OUTPUT:-json_schema}
      EXECUTOR_LLM_OPTIONS_JSON: ${EXECUTOR_LLM_OPTIONS_JSON:-}
      EXECUTOR_MODEL_TIMEOUT_SECONDS: ${EXECUTOR_MODEL_TIMEOUT_SECONDS:-45}
      EXECUTOR_ADB_TIMEOUT_SECONDS: ${EXECUTOR_ADB_TIMEOUT_SECONDS:-10}
      EXECUTOR_CANCEL_TIMEOUT_SECONDS: ${EXECUTOR_CANCEL_TIMEOUT_SECONDS:-20}
      EXECUTOR_MONITOR_INTERVAL_SECONDS: ${EXECUTOR_MONITOR_INTERVAL_SECONDS:-5}
      EXECUTOR_MEDIA_PROBE: ${EXECUTOR_MEDIA_PROBE:-true}
      EXECUTOR_RUNTIME_MAX_AGE_SECONDS: ${EXECUTOR_RUNTIME_MAX_AGE_SECONDS:-15}
      EXECUTOR_VISUAL_MONITOR_INTERVAL_SECONDS: ${EXECUTOR_VISUAL_MONITOR_INTERVAL_SECONDS:-30}
      EXECUTOR_COMPLETION_INTERVAL_SECONDS: ${EXECUTOR_COMPLETION_INTERVAL_SECONDS:-15}
      EXECUTOR_MAX_ACTIONS: ${EXECUTOR_MAX_ACTIONS:-30}
      EXECUTOR_SETTLE_SECONDS: ${EXECUTOR_SETTLE_SECONDS:-1}
      CONTROLLER_DATABASE: /data/${CONTROLLER_MODE:-demo}.sqlite3
    volumes:
      - controller-data:/data
volumes:
  controller-data:
