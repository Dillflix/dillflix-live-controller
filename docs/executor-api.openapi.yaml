openapi: 3.1.0
info:
  title: Dillflix Executor API — three-operation v1 proposal
  version: 1.0.0-draft.2
  description: Proposed external service, not implemented controller routes. POST Play returns a durable token;
    GET token returns playback and lifecycle; POST Cancel stops active/pending playback and provides the manual-input
    barrier. Separate request recovery, device observation, content-ID lookup, authority leases, and Stop are out
    of scope. See executor-api-handoff.md. Defaults and evidence policy require implementation validation.
servers:
- url: https://executor.example.invalid
  description: Replace with a server-side configured, controller-reachable executor address.
security:
- ServiceBearer: []
paths:
  /v1/playbacks:
    post:
      operationId: initiatePlayback
      summary: Durably accept live playback and return its token
      description: 'Identical request_id and body retries return the same token without relaunching. Changed body
        is 409. A transport timeout is an unknown outcome: retry this same POST while current intent remains eligible.
        No separate request-ID recovery endpoint. Higher intents stop older input before navigation starts. Check
        the durable device cancellation fence before issuing any input.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackRequest'
            examples:
              StartPlayback:
                $ref: '#/components/examples/StartPlayback'
      responses:
        '202':
          description: Accepted; navigation runs asynchronously. Acceptance does not verify playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackReport'
              examples:
                Accepted:
                  $ref: '#/components/examples/Accepted'
          headers:
            Location:
              schema:
                type: string
              description: Relative token status URL, e.g. /v1/playbacks/pb-example-001.
        '200':
          description: Identical retry; same token and current report, no duplicate navigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackReport'
              examples:
                Verified:
                  $ref: '#/components/examples/Verified'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/playbacks/{token}:
    get:
      operationId: getPlaybackStatus
      summary: Read playback progress, current evidence and event completion by token
      description: 'Read-only, bounded and Cache-Control: no-store. Never navigate, resume, or stop from this getter.
        A successful status read can report unavailable playback/lifecycle evidence. A historical playing_verified
        result is not proof of current playback. Ended requires explicit evidence for the requested content scope.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      responses:
        '200':
          description: Complete status envelope; independent evidence may be unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackReport'
              examples:
                Verified:
                  $ref: '#/components/examples/Verified'
                Ended:
                  $ref: '#/components/examples/Ended'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/playbacks/cancel:
    post:
      operationId: cancelPlayback
      summary: Cancel navigation and stop owned active playback, or fence a device for manual control
      description: 'One Cancel API, two mutually exclusive scopes. Persist cancellation before stopping/draining
        input. Return 200 only after confirmed quiescence and active stop/already-inactive. Retry is idempotent.
        On timeout/503 cancellation is unconfirmed: manual input stays disabled and the controller retries. A device
        fence covers late Play deliveries whose token was never received. No authority or renewal endpoints.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            examples:
              CancelToken:
                $ref: '#/components/examples/CancelToken'
              CancelForManual:
                $ref: '#/components/examples/CancelForManual'
      responses:
        '200':
          description: Durable cancellation acknowledged; no further input in scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
              examples:
                CancelledToken:
                  $ref: '#/components/examples/CancelledToken'
                ManualReady:
                  $ref: '#/components/examples/ManualReady'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      description: Server-side scoped service credential, separate from playback tokens and browser owner_token.
  schemas:
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          maxLength: 1000
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 0
      required:
      - code
      - message
      - retryable
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          minLength: 1
          maxLength: 200
        retryable:
          type: boolean
        instance:
          type: string
          format: uri-reference
      required:
      - type
      - title
      - status
      - detail
      - code
      - retryable
      additionalProperties: true
    Evidence:
      type: object
      properties:
        method:
          type: string
          enum:
          - provider_status
          - device_observation
          - video_inference
          - operator
        evidence_id:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 1000
        confidence:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        decision:
          type: string
          enum:
          - none
          - candidate
          - confirmed
        captured_at:
          type: string
          format: date-time
        model_version:
          type: string
        policy_version:
          type: string
      required:
      - method
      - evidence_id
      - summary
      - confidence
      additionalProperties: false
      description: Evidence metadata, not embedded screenshots. Confidence is not itself a verification or completion
        policy. Decision confirmed is required for ended/cancelled lifecycle observations.
    ContentSnapshot:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - id
      additionalProperties: true
      description: Complete unchanged original Teamarr feed entry. Only id is constrained here; preserve every original
        event/team/session/broadcast/option/extension field. This is not a reduced DTO.
    ViewingOption:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - id
      additionalProperties: true
      description: Complete unchanged original allowed option, including review reasons and unknown fields. Additional
        properties are deliberately preserved.
    PlaybackRequest:
      type: object
      properties:
        schema_version:
          const: 1
          type: integer
        request_id:
          type: string
          minLength: 1
          maxLength: 200
        device_id:
          type: string
          minLength: 1
          maxLength: 200
        intent_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content_id:
          type: string
          minLength: 1
          maxLength: 1024
        mode:
          const: live
          type: string
        purpose:
          type: string
          enum:
          - selection
          - route_handoff
          - recovery
        previous_request_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1024
          - type: 'null'
        content_snapshot_schema_version:
          const: 1
          type: integer
        content_snapshot:
          $ref: '#/components/schemas/ContentSnapshot'
        allowed_viewing_options:
          type: array
          items:
            $ref: '#/components/schemas/ViewingOption'
          minItems: 1
        deadline_at:
          type: string
          format: date-time
          description: Absolute navigation deadline; stable across delivery retries. Does not end an event or limit
            successful playback duration.
      required:
      - schema_version
      - request_id
      - device_id
      - intent_version
      - content_id
      - mode
      - content_snapshot_schema_version
      - content_snapshot
      - allowed_viewing_options
      - deadline_at
      additionalProperties: false
      description: Full controller request plus fixed navigation deadline. request_id deduplicates identical POST
        retries; content_id must equal content_snapshot.id. New work requires an intent above the device cancellation
        fence. Preserve every original allowed option.
    RouteAttempt:
      type: object
      properties:
        attempt:
          type: integer
          minimum: 1
        viewing_option_id:
          type: string
          minLength: 1
          maxLength: 1024
        phase:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
      required:
      - attempt
      - viewing_option_id
      - phase
      - started_at
      - finished_at
      - error
      additionalProperties: false
    Operation:
      type: object
      properties:
        state:
          type: string
          enum:
          - accepted
          - navigating
          - playing_verified
          - failed
          - cancelled
          - superseded
          - timed_out
        phase:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        deadline_at:
          type: string
          format: date-time
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/RouteAttempt'
      required:
      - state
      - phase
      - created_at
      - updated_at
      - finished_at
      - deadline_at
      - error
      - attempts
      additionalProperties: false
      description: State of this navigation job. playing_verified is historical launch success, not proof of ongoing
        playback. finished_at never means event completion.
    PlaybackObservation:
      type: object
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 200
        request_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1024
          - type: 'null'
        intent_version:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        content_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1024
          - type: 'null'
        viewing_option_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1024
          - type: 'null'
        presentation:
          type: string
          enum:
          - live
          - replay
          - unknown
        verified:
          type: boolean
        simulated:
          const: false
          type: boolean
        health:
          type: string
          enum:
          - healthy
          - buffering
          - paused
          - menu
          - offline
          - unknown
        observed_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        evidence:
          $ref: '#/components/schemas/Evidence'
      required:
      - device_id
      - request_id
      - intent_version
      - content_id
      - viewing_option_id
      - presentation
      - verified
      - simulated
      - health
      - observed_at
      - valid_until
      - evidence
      additionalProperties: false
      description: Evidence for this token only. verified=true requires matching device/request/intent/content,
        a permitted route, live presentation, healthy playback and acquisition within 15 seconds. Never refresh
        timestamps by polling cached data. After stop, switch or manual takeover, return null or verified=false;
        never substitute another token.
      allOf:
      - if:
          properties:
            verified:
              const: true
          required:
          - verified
        then:
          properties:
            request_id:
              type: string
              minLength: 1
              maxLength: 200
            intent_version:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            content_id:
              type: string
              minLength: 1
              maxLength: 1024
            viewing_option_id:
              type: string
              minLength: 1
              maxLength: 1024
            presentation:
              const: live
            health:
              const: healthy
    ObservationStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - fresh
          - stale
          - unavailable
        checked_at:
          type: string
          format: date-time
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
      required:
      - state
      - checked_at
      - error
      additionalProperties: false
      description: Freshness is evaluated at response time. A stale observation cannot retain verified=true. A successful
        endpoint does not imply healthy playback.
    LifecycleObservation:
      type: object
      properties:
        content_id:
          type: string
          minLength: 1
          maxLength: 1024
        state:
          type: string
          enum:
          - scheduled
          - live
          - ended
          - cancelled
          - delayed
          - suspended
          - postponed
          - unknown
        source:
          type: string
          minLength: 1
        simulated:
          const: false
          type: boolean
        timestamp_basis:
          type: string
          enum:
          - provider
          - device_observed
        observed_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        phase:
          anyOf:
          - type: string
          - type: 'null'
        actual_end_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        updated_start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        evidence:
          $ref: '#/components/schemas/Evidence'
      required:
      - content_id
      - state
      - source
      - simulated
      - timestamp_basis
      - observed_at
      - received_at
      - valid_until
      - evidence
      additionalProperties: false
      description: Real lifecycle evidence. device_observed is a proposed extension to the current controller validator.
        Ended/cancelled must be confirmed for this content scope. Candidate video results cannot set ended. Preserve
        source acquisition times.
      allOf:
      - if:
          properties:
            state:
              enum:
              - ended
              - cancelled
          required:
          - state
        then:
          properties:
            evidence:
              properties:
                decision:
                  const: confirmed
              required:
              - decision
    ContentStatus:
      type: object
      properties:
        content_id:
          type: string
          minLength: 1
          maxLength: 1024
        lookup_state:
          type: string
          enum:
          - ok
          - unavailable
          - not_found
          - unsupported
        effective_state:
          type: string
          enum:
          - scheduled
          - live
          - ended
          - cancelled
          - delayed
          - suspended
          - postponed
          - unknown
        stale:
          type: boolean
        observation:
          anyOf:
          - $ref: '#/components/schemas/LifecycleObservation'
          - type: 'null'
        checked_at:
          type: string
          format: date-time
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
      required:
      - content_id
      - lookup_state
      - effective_state
      - stale
      - observation
      - checked_at
      - error
      additionalProperties: false
      description: A lookup failure can coexist with previous evidence. Expired nonterminal evidence projects to
        unknown; previously confirmed terminal facts may persist with stale=true. Missing source support is not
        event completion. checked_at is not observed_at.
    CancellationState:
      type: object
      properties:
        state:
          type: string
          enum:
          - none
          - requested
          - acknowledged
        input_quiescent:
          type: boolean
      required:
      - state
      - input_quiescent
      additionalProperties: false
      description: Acknowledged means pending input has drained, active playback attributable to this token has
        stopped (or was already inactive), and this token can never issue further input. Cancellation is not event
        completion.
      allOf:
      - if:
          properties:
            state:
              const: acknowledged
          required:
          - state
        then:
          properties:
            input_quiescent:
              const: true
    PlaybackReport:
      type: object
      properties:
        schema_version:
          const: 1
          type: integer
        token:
          type: string
          minLength: 1
          maxLength: 200
        request_id:
          type: string
          minLength: 1
          maxLength: 200
        device_id:
          type: string
          minLength: 1
          maxLength: 200
        content_id:
          type: string
          minLength: 1
          maxLength: 1024
        intent_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        operation:
          $ref: '#/components/schemas/Operation'
        observation:
          anyOf:
          - $ref: '#/components/schemas/PlaybackObservation'
          - type: 'null'
        observation_status:
          $ref: '#/components/schemas/ObservationStatus'
        content_status:
          $ref: '#/components/schemas/ContentStatus'
        cancellation:
          $ref: '#/components/schemas/CancellationState'
        retained_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - schema_version
      - token
      - request_id
      - device_id
      - content_id
      - intent_version
      - revision
      - operation
      - observation
      - observation_status
      - content_status
      - cancellation
      - retained_until
      additionalProperties: false
      description: One token getter returns navigation history, fresh playback evidence, and content lifecycle.
        No device-observation or content-ID lookup endpoint is required. revision increases monotonically per token.
        retained_until=null while active; retain inactive token records for at least seven days.
      allOf:
      - if:
          properties:
            observation_status:
              properties:
                state:
                  enum:
                  - stale
                  - unavailable
        then:
          properties:
            observation:
              anyOf:
              - type: 'null'
              - properties:
                  verified:
                    const: false
    CancelByToken:
      type: object
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 200
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - device_id
      - token
      additionalProperties: false
      description: Stop this token, including active playback. Never stop or inject input into newer playback.
    CancelThroughIntent:
      type: object
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 200
        through_intent_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - device_id
      - through_intent_version
      additionalProperties: false
      description: Manual takeover barrier. Persist a monotonic cancellation fence, cancel/stop all work through
        this intent, reject late arrivals at or below it, and drain owned input before acknowledgement. Higher intents
        are unaffected.
    CancelRequest:
      oneOf:
      - $ref: '#/components/schemas/CancelByToken'
      - $ref: '#/components/schemas/CancelThroughIntent'
    CancelResult:
      type: object
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 200
        token:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        through_intent_version:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        input_quiescent:
          type: boolean
          const: true
        active_playback:
          type: string
          enum:
          - stopped
          - already_inactive
        acknowledged_at:
          type: string
          format: date-time
      required:
      - device_id
      - token
      - through_intent_version
      - input_quiescent
      - active_playback
      - acknowledged_at
      additionalProperties: false
      description: Only return 200 after cancellation and stop are confirmed for the requested scope. Exactly one
        of token or through_intent_version is non-null. already_inactive sends no stop input to a newer/manual target.
      oneOf:
      - properties:
          token:
            type: string
            minLength: 1
            maxLength: 200
          through_intent_version:
            type: 'null'
      - properties:
          token:
            type: 'null'
          through_intent_version:
            type: integer
            minimum: 0
            maximum: 9007199254740991
  examples:
    StartPlayback:
      summary: Synthetic full snapshot; substitute the untouched real Teamarr entry and options
      value:
        schema_version: 1
        request_id: req-example-001
        device_id: living-room
        intent_version: 23
        content_id: example-content-001
        mode: live
        purpose: selection
        previous_request_id: null
        content_snapshot_schema_version: 1
        content_snapshot:
          id: example-content-001
          kind: event
          source: games
          title: Canadiens at Maple Leafs
          competition: nhl
          sports:
          - nhl
          provider: example
          start_time: '2026-09-30T19:00:00Z'
          expected_end_time: '2026-09-30T22:00:00Z'
          end_time_estimated: true
          timing_basis: demo_duration
          status: live
          event:
            league: nhl
            season_type: playoffs
            away_team_details:
              id: MTL
              provider: demo
              city: Montreal
              name: Canadiens
              full_name: Montreal Canadiens
              short_name: Canadiens
              abbreviation: MTL
              logo_url: null
            home_team_details:
              id: TOR
              provider: demo
              city: Toronto
              name: Maple Leafs
              full_name: Toronto Maple Leafs
              short_name: Maple Leafs
              abbreviation: TOR
              logo_url: null
            event_id: canadiens
            provider: demo
            home_team: Toronto Maple Leafs
            away_team: Montreal Canadiens
          sessions: []
          broadcast: null
          related_ids: []
          viewing_options:
          - id: example-option-001
            app: demo_provider
            decision: eligible
            reasons: []
            presentation: live
            basis: synthetic_contract_example
            coverage_type: full
          artwork: {}
        allowed_viewing_options:
        - id: example-option-001
          app: demo_provider
          decision: eligible
          reasons: []
          presentation: live
          basis: synthetic_contract_example
          coverage_type: full
        deadline_at: '2026-09-30T20:02:00Z'
      x-schema: PlaybackRequest
    Accepted:
      summary: Durably accepted; no playback claim
      value:
        schema_version: 1
        token: pb-example-001
        request_id: req-example-001
        device_id: living-room
        content_id: example-content-001
        intent_version: 23
        revision: 1
        operation:
          state: accepted
          phase: queued
          created_at: '2026-09-30T20:00:00Z'
          updated_at: '2026-09-30T20:00:00Z'
          finished_at: null
          deadline_at: '2026-09-30T20:02:00Z'
          error: null
          attempts: []
        observation: null
        observation_status:
          state: unavailable
          checked_at: '2026-09-30T20:00:10Z'
          error: null
        content_status:
          content_id: example-content-001
          lookup_state: unavailable
          effective_state: unknown
          stale: true
          observation: null
          checked_at: '2026-09-30T20:00:10Z'
          error:
            code: status_source_unavailable
            message: Lifecycle evidence is unavailable
            retryable: true
        cancellation:
          state: none
